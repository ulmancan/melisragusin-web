# Netlify build & deploy ayarları
# Panelden (Decap CMS) bir kayıt eklenip/düzenlenince Netlify bu komutu çalıştırır:
# data/ klasöründeki dosyalardan data-*.js dosyaları yeniden üretilir, ardından
# yayınlanacak site dist/ klasörüne hazırlanır (eski adresler, SEO, site haritası, yönlendirmeler: seo.mjs).

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Güvenlik ve önbellek başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
