# Netlify build & deploy ayarları
# Panelden (Studio, /admin/) yayınlanınca Netlify bu komutu çalıştırır:
# data/ klasöründeki dosyalardan data-*.js dosyaları yeniden üretilir, ardından
# yayınlanacak site dist/ klasörüne hazırlanır (eski adresler, SEO, site haritası, yönlendirmeler: seo.mjs).

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# the light copies of the pictures (assets/v/, made by build.mjs) are kept between deploys,
# so only pictures that are new get made
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["assets/v"]

# Güvenlik ve önbellek başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
