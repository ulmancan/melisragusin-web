<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Melis Ragusin — Virtual Gallery</title>
<meta name="description" content="Melis Ragusin — new media and mixed media artist. Walk through her motion art, new-media and mixed-media works in a virtual gallery.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Melis Ragusin"><meta property="og:title" content="Melis Ragusin — Virtual Gallery"><meta property="og:description" content="Walk through the works of Melis Ragusin in a virtual gallery.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f2ee;--muted:#9d9890;--line:rgba(244,242,238,.16);--gold:#c6a870;--ease:cubic-bezier(.19,1,.22,1);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden;overscroll-behavior:none;overscroll-behavior-x:none;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ui{position:fixed;z-index:5;pointer-events:none}
.ui *{pointer-events:auto}
.top{left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:clamp(18px,2.6vw,34px) clamp(20px,4vw,56px);background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.top .logo img{height:clamp(30px,3vw,46px);width:auto;display:block}
.top nav{display:flex;align-items:center;gap:clamp(14px,2vw,28px)}
.top nav a{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#d8d2c8;padding:10px 0;border-bottom:1px solid transparent;transition:border-color .4s,color .4s}
.top nav a:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.top nav .site{padding:11px 18px;border:1px solid rgba(244,242,238,.35);border-radius:999px}
.top nav .site:hover{background:var(--ink);color:#000;border-color:var(--ink)}
body[data-world="lobby"] #toLobby{display:none}
.hint{left:50%;bottom:clamp(22px,4vh,40px);transform:translate(-50%,10px);opacity:0;transition:opacity .8s,transform .8s var(--ease);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d2c8;padding:12px 20px;border:1px solid rgba(244,242,238,.18);border-radius:999px;background:rgba(0,0,0,.45);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.hint.on{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);opacity:0;transition:opacity .25s;white-space:nowrap}
#tip.on{opacity:1}
@media (hover:none){#tip{display:none}}
#toast{position:fixed;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%) scale(.98);opacity:0;pointer-events:none;transition:opacity .5s,transform .6s var(--ease);font-family:var(--serif);font-size:clamp(20px,2vw,28px);font-weight:300;text-align:center;padding:20px 30px;background:rgba(0,0,0,.72);border:1px solid var(--line);border-radius:3px;max-width:86vw}
#toast.on{opacity:1;transform:translate(-50%,-50%)}
/* the information card for a work */
#info{position:fixed;right:clamp(16px,3vw,44px);top:50%;z-index:6;width:min(380px,calc(100vw - 32px));transform:translate(24px,-50%);opacity:0;pointer-events:none;transition:opacity .6s,transform .8s var(--ease);padding:clamp(22px,2.4vw,32px);background:rgba(8,8,8,.82);border:1px solid var(--line);border-radius:3px;display:grid;gap:14px}
#info.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#info .k{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
#info h2{font-family:var(--serif);font-weight:300;font-size:clamp(30px,2.6vw,42px);line-height:1.02}
#info .f{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
#info .f b{display:block;font-weight:400;font-size:13px;letter-spacing:.04em;text-transform:none;color:var(--ink);margin-top:4px}
#info p{font-size:14px;line-height:1.75;color:#cfc9c0}
#info .act{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
#info .act a{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;padding:11px 16px;border:1px solid rgba(244,242,238,.35);border-radius:999px;transition:background .4s,color .4s}
#info .act a:hover{background:var(--ink);color:#000}
#info .nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-size:11px;letter-spacing:.22em;color:var(--muted)}
#info .nav button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;transition:background .3s}
#info .nav button:hover{background:rgba(255,255,255,.1)}
#iX{position:absolute;top:10px;right:10px;width:34px;height:34px;font-size:22px;line-height:1;color:var(--muted)}
@media (max-width:700px){#info{top:auto;bottom:12px;right:12px;transform:translateY(24px)}#info.on{transform:none}#info p{display:none}}
/* fade between rooms */
#fade{position:fixed;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .85s ease;display:grid;place-items:center}
#fade.on{opacity:1}
#fadeT{display:grid;justify-items:center;gap:8px;font-family:var(--serif);font-weight:300;font-size:clamp(40px,6vw,96px);line-height:1}
#fadeT i{font-size:.45em;color:var(--gold)}
/* loader: the MR mark, as everywhere on the site */
#mrload{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .9s var(--ease),visibility .9s}
#mrload img{width:clamp(80px,15vw,116px);opacity:0;animation:mi 1s var(--ease) forwards}
@keyframes mi{to{opacity:.96}}
#mrload.done{opacity:0;visibility:hidden;pointer-events:none}
/* while the lobby lights up, the controls wait and then fade in */
#lnav,.top{transition:opacity 1.2s var(--ease)}
body.intro #lnav{opacity:0;pointer-events:none}
body.intro .top{opacity:.0}
/* lobby arrows for phones */
.lnav{left:50%;bottom:clamp(20px,4vh,40px);transform:translateX(-50%);display:none;align-items:center;gap:10px}
.lnav button{height:44px;min-width:44px;border:1px solid rgba(244,242,238,.3);border-radius:999px;background:rgba(0,0,0,.45);font-size:16px}
.lnav #hallName{padding:0 18px;white-space:nowrap;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
@media (max-width:899px),(hover:none){body[data-world="lobby"] .lnav{display:flex}}
@media (max-width:700px){
  .top{padding:14px 16px}
  .top .logo img{height:24px}
  .top nav{gap:10px}
  .top nav a{font-size:10px;letter-spacing:.2em}
  .top nav .site{padding:8px 12px;white-space:nowrap}
  .top nav .site .sl{display:none}
  .top nav .site::before{content:'Site'}
  #info{padding:18px 18px 14px;gap:10px}
  #info h2{font-size:28px}
  #info .act a{padding:9px 12px;font-size:9.5px}
  #info .nav{padding-top:10px}
}
/* walking arrows, bottom right: a brushed-metal controller with a brass bezel that tilts under your finger */
.pad{right:clamp(18px,2.8vw,40px);bottom:clamp(18px,3.4vh,36px);width:150px;height:150px;perspective:520px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.pad .disc{position:absolute;inset:0;border-radius:50%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.9,.25,1);
  background:radial-gradient(120% 90% at 50% 8%,rgba(255,250,240,.13),transparent 46%),repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),radial-gradient(circle at 50% 50%,#1d1c1a 0 55%,#141312 72%,#0b0b0a 100%);
  box-shadow:0 30px 50px -14px rgba(0,0,0,.9),0 10px 18px rgba(0,0,0,.55),inset 0 1.5px 0 rgba(255,255,255,.16),inset 0 -4px 10px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.5)}
.pad .disc::before{content:'';position:absolute;inset:-3px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 200deg,#5e4a2b,#d9bf8a 12%,#8a6c3e 24%,#f3e1b6 38%,#7a5f36 52%,#c9a86c 66%,#5e4a2b 80%,#e9d3a1 92%,#5e4a2b);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.6px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.6px));opacity:.85}
.pad .disc::after{content:'';position:absolute;inset:17px;border-radius:50%;pointer-events:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.65),inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.04)}
.pad button{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;z-index:1;outline:none}
.pad button::before{content:'';position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(226,196,138,.42),rgba(226,196,138,0) 70%);opacity:0;transition:opacity .25s}
.pad button svg{position:relative;width:20px;height:20px;fill:none;stroke:#d9d2c6;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.9));transition:stroke .25s,transform .25s,filter .25s}
.pad button:hover svg{stroke:#e9d3a1}
.pad button:focus-visible svg{stroke:#f3e1b6}
.pad button.on::before{opacity:1}
.pad button.on svg{stroke:#fff3d6;filter:drop-shadow(0 0 6px rgba(240,205,140,.9))}
.pad .u{left:48px;top:4px}.pad .d{left:48px;bottom:4px}.pad .l{left:4px;top:48px}.pad .r{right:4px;top:48px}
.pad .u.on svg{transform:translateY(-2px)}.pad .d.on svg{transform:translateY(2px)}.pad .l.on svg{transform:translateX(-2px)}.pad .r.on svg{transform:translateX(2px)}
.pad .hub{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;z-index:2;cursor:grab;touch-action:none;transition:transform .45s cubic-bezier(.2,.9,.25,1),box-shadow .3s;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.22),transparent 42%),repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.03) 0 1px,transparent 1px 2.5px),radial-gradient(circle at 50% 50%,#34312d,#171615 70%,#0d0c0b);
  box-shadow:0 6px 12px rgba(0,0,0,.75),0 2px 3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 4px rgba(0,0,0,.6),0 0 0 1px rgba(198,168,112,.28)}
.pad .hub::before{content:'';position:absolute;inset:-10px;border-radius:50%}
.pad .hub:hover,.pad.joy .hub{box-shadow:0 6px 12px rgba(0,0,0,.75),0 2px 3px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 4px rgba(0,0,0,.6),0 0 0 1px rgba(226,196,138,.6),0 0 14px rgba(226,196,138,.25)}
.pad.joy .hub{transition:box-shadow .3s;cursor:grabbing}.pad.joy .disc{transition:transform .12s ease-out}
.pad.joy .hub::after{box-shadow:0 0 10px rgba(240,205,140,.95)}
.pad .hub::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3d6,#c9a86c 60%,#7a5f36);box-shadow:0 0 6px rgba(226,196,138,.55)}
.pad:has(.u.on) .disc{transform:rotateX(13deg)}.pad:has(.d.on) .disc{transform:rotateX(-13deg)}
.pad:has(.l.on) .disc{transform:rotateY(-13deg)}.pad:has(.r.on) .disc{transform:rotateY(13deg)}
.pad:has(.u.on) .hub{transform:translateY(-3px)}.pad:has(.d.on) .hub{transform:translateY(3px)}.pad:has(.l.on) .hub{transform:translateX(-3px)}.pad:has(.r.on) .hub{transform:translateX(3px)}
/* floor plan, bottom left */
.map{left:clamp(16px,2.6vw,36px);bottom:clamp(16px,3vh,32px);padding:12px 12px 8px;border:1px solid rgba(244,242,238,.14);border-radius:3px;background:rgba(8,8,8,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.map:empty{display:none}
.map .mt{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map svg{display:block}
.map .room{fill:none;stroke:rgba(244,242,238,.35);stroke-width:1}
.map .wall{fill:rgba(244,242,238,.3)}
.map .dot{fill:rgba(244,242,238,.55);cursor:pointer;transition:fill .3s}
.map .dot:hover,.map .dot.on{fill:var(--gold)}
.map #me path{fill:#8fd8cf}
/* on smaller screens the hint sits at the top inside the halls, clear of the floor plan and the controller */
@media (min-width:701px) and (max-width:1199px) and (min-height:561px){body[data-world="hall"] .hint{bottom:auto;top:88px}}
@media (max-width:700px){
  .pad{transform:scale(.86);transform-origin:100% 100%}
  .map{display:none}
  #info.on ~ .pad, body:has(#info.on) .pad{opacity:0;pointer-events:none}
  .hint{bottom:auto;top:76px}
  body[data-world="lobby"] .pad{display:none}
}
body[data-world="lobby"] .map{display:none}
/* the walking controller belongs to the halls: in the lobby you choose a door by pointing at it */
.pad{transition:opacity .6s var(--ease),visibility .6s}
body[data-world="lobby"] .pad{opacity:0;visibility:hidden;pointer-events:none}
noscript{position:fixed;inset:0;display:grid;place-items:center;font-size:16px}
@media (hover:none){.map{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(8,8,8,.82)}}
/* phones held sideways: the card fits the screen and scrolls, the map and the controller step aside while it is open */
@media (orientation:landscape) and (max-height:560px){
  .top{padding:10px 18px}
  .top .logo img{height:24px}
  .hint{bottom:auto;top:62px}
  #info{top:58px;bottom:10px;right:12px;width:min(340px,46vw);max-height:calc(100svh - 68px);overflow-y:auto;overscroll-behavior:contain;transform:translateX(24px);padding:16px 18px 12px;gap:8px}
  #info.on{transform:none}
  #info h2{font-size:26px}
  #info p{display:none}
  .map{transform:scale(.72);transform-origin:0 100%}
  .pad{transform:scale(.78);transform-origin:100% 100%}
}
@media (max-width:700px),(orientation:landscape) and (max-height:560px){
  body:has(#info.on) .pad,body:has(#info.on) .map{opacity:0;pointer-events:none}
  .pad,.map{transition:opacity .4s}
}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 95% at 50% 50%,transparent 52%,rgba(0,0,0,.42) 100%)}
</style>
</head>
<body data-world="lobby">
<div id="mrload"><img src="assets/logo-mr.png" alt=""></div>
<canvas id="gl" aria-label="Virtual gallery"></canvas>
<header class="ui top">
  <a class="logo" href="home.html" aria-label="Melis Ragusin — home"><img src="assets/logo-wordmark-tight.png" alt="Melis Ragusin"></a>
  <nav><a href="#" id="toLobby">Lobby</a><a class="site" href="home.html"><span class="sl">Enter the site</span> &#8594;</a></nav>
</header>
<div class="ui hint" id="hint" role="status"></div>
<div class="ui lnav" id="lnav"><button id="lPrev" aria-label="Previous hall">&#8592;</button><button id="hallName">Motion Art</button><button id="lNext" aria-label="Next hall">&#8594;</button></div>
<div class="ui pad" id="pad" aria-label="Walk"><div class="disc">
  <button data-k="arrowup" class="u" aria-label="Walk forward"><svg viewBox="0 0 24 24"><path d="M6 14.5l6-6 6 6"/></svg></button>
  <button data-k="arrowleft" class="l" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
  <button data-k="arrowright" class="r" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
  <button data-k="arrowdown" class="d" aria-label="Walk back"><svg viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg></button>
  <span class="hub" role="slider" aria-label="Joystick: drag to walk and turn" title="Drag to walk"></span>
</div></div>
<div class="ui map" id="map"></div>
<div id="tip"></div>
<div id="toast" role="status"></div>
<aside id="info" aria-live="polite">
  <button id="iX" aria-label="Close">&times;</button>
  <div class="k" id="iK"></div>
  <h2 id="iT"></h2>
  <div class="f" id="iF"></div>
  <p id="iL"></p>
  <div class="act"><a id="iV" href="#">View the work &#8594;</a><a id="iB" href="#" target="_blank" rel="noopener">Buy <span aria-hidden="true">&#8599;</span></a></div>
  <div class="nav"><button id="iP" aria-label="Previous work">&#8592;</button><span id="iN"></span><button id="iNx" aria-label="Next work">&#8594;</button></div>
</aside>
<div id="fade"><div id="fadeT"></div></div>
<noscript>The virtual gallery needs JavaScript. <a href="home.html">Enter the site</a></noscript>
<script src="data-projects.js"></script>
<script src="data-img.js"></script>
<script src="data-gallery.js"></script>
<script src="assets/gallery/gallery.js"></script>
</body>
</html>
